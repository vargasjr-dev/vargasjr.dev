# Terraform plan (PRs) / apply (merges to main) for this repo — keyless via
# Workload Identity Federation. The provider path + service account are
# hardcoded identifiers (not credentials) provisioned by this repo's own
# terraform — see terraform/wif.tf.
#
# Prereqs that are manual by design: the vargasjr-dev project, billing link,
# and the gs://vargasjr-dev-tfstate bucket (bootstrap rules — state can't
# manage its own home). The very first apply also runs locally, since the
# WIF pool this workflow authenticates through is created BY that apply.

name: Terraform

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411402639456/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: terraform-apply@vargasjr-dev.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform
          path: terraform/plan.txt

      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
