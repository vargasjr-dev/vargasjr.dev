# One-off infra operations: run a shell script from an open same-repository PR
# with production GCP access (WIF). The operation PR is never merged — it
# exists only so the script is reviewable before Vargas dispatches it.

name: Run PR Infra Operation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR containing the operation script"
        required: true
        type: string
      script:
        description: "One-time script path under scripts/infra-operations/"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: production-infra-operation
  cancel-in-progress: false

jobs:
  run:
    name: Run PR infra operation
    runs-on: ubuntu-latest
    if: github.actor == 'dvargasfuertes'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Validate operation PR
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          OPERATION_SCRIPT: ${{ inputs.script }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/infra-operation.ts

      - name: Check out PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate for GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411402639456/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: terraform-apply@vargasjr-dev.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3

      - name: Run operation script
        env:
          OPERATION_SCRIPT: ${{ inputs.script }}
        run: bash "$OPERATION_SCRIPT"
