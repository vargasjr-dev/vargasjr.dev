name: Dispatcher

on:
  push:
    branches: [main]
    paths: ["services/stripe-dispatcher/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  build-push-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411402639456/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: terraform-apply@vargasjr-dev.iam.gserviceaccount.com

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=us-central1-docker.pkg.dev/vargasjr-dev/portfolio/stripe-dispatcher
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest services/stripe-dispatcher
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - uses: hashicorp/setup-terraform@v3

      - name: Apply
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
