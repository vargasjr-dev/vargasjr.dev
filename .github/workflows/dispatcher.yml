name: Dispatcher

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/dispatcher.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411402639456/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: terraform-apply@vargasjr-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - id: changed
        name: Detect changed services
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICES="$(ls services/)"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [[ "$BEFORE" == 0* ]]; then BEFORE="$(git rev-parse HEAD~1)"; fi
            SERVICES="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- services/ | cut -d/ -f2 | sort -u | grep . || true)"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "changed: $SERVICES"

      - name: Build and push images (buildpacks, no Dockerfile)
        if: steps.changed.outputs.services != ''
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          for SERVICE in ${{ steps.changed.outputs.services }}; do
            IMAGE="us-central1-docker.pkg.dev/vargasjr-dev/portfolio/$SERVICE"
            gcloud builds submit "services/$SERVICE" --service-account=projects/vargasjr-dev/serviceAccounts/terraform-apply@vargasjr-dev.iam.gserviceaccount.com --default-buckets-behavior=regional-user-owned-bucket --pack image="$IMAGE:${{ github.sha }}"
            gcloud artifacts docker tags add "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          done
