name: Dispatcher

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/dispatcher.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411402639456/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: terraform-apply@vargasjr-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - uses: oven-sh/setup-bun@v2

      - id: changed
        name: Detect changed services
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICES="$(ls services/)"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [[ "$BEFORE" == 0* ]]; then BEFORE="$(git rev-parse HEAD~1)"; fi
            SERVICES="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- services/ | cut -d/ -f2 | sort -u | grep . || true)"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "changed: $SERVICES"

      - name: Build, push, and roll the changed services
        if: steps.changed.outputs.services != ''
        env:
          SERVICES: ${{ steps.changed.outputs.services }}
        run: bun scripts/deploy-services.ts
