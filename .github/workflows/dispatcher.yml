name: Dispatcher

on:
  push:
    branches: [main]
    paths: ["services/stripe-dispatcher/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411402639456/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: terraform-apply@vargasjr-dev.iam.gserviceaccount.com

      - name: Build and push image (buildpacks, no Dockerfile)
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          gcloud builds submit services/stripe-dispatcher \
            --pack image=us-central1-docker.pkg.dev/vargasjr-dev/portfolio/stripe-dispatcher:${{ github.sha }}
          gcloud builds submit services/stripe-dispatcher \
            --pack image=us-central1-docker.pkg.dev/vargasjr-dev/portfolio/stripe-dispatcher:latest
